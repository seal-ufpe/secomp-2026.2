events {}
http {
    upstream frontend {
        server frontend:3000;
    }
    upstream backend {
        server backend:4000;
    }
    server {
        listen 8080;
        location / {
            proxy_pass http://frontend/;
        }
        location /api/ {
            resolver 127.0.0.11 valid=10s;
            set $backend_upstream http://backend:4000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $backend_upstream;
            proxy_buffering off; 
            proxy_http_version 1.1;  
            proxy_read_timeout 1h;
        }
    }
}