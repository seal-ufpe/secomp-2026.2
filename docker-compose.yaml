services:
  nginx:
    container_name: nginx
    build:
      context: apps/nginx
      dockerfile: Dockerfile
    ports: 
      - "80:8080"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - private_network
      - public_network
    
  frontend:
    container_name: frontend
    build:
      context: apps/frontend
      dockerfile: Dockerfile
    networks:
      - public_network
    restart: unless-stopped

  backend:
    container_name: backend
    build:
      context: apps/backend
      dockerfile: Dockerfile
    env_file:
      - ./apps/backend/.env
    networks:
      - public_network
    restart: unless-stopped
      
networks:
  private_network:
    driver: bridge
  public_network:
    driver: bridge